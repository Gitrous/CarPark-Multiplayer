<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Park Multijugador</title>
<style>
  :root {
    --bg: #14161c; --panel: #1e2129; --panel2: #262a34; --text: #e8eaf0; --muted: #9aa0ad;
    --accent: #f5b301; --good: #3ecf6e; --bad: #ef5350; --border: #333845;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
  button.good { background: var(--good); color: #102015; border-color: var(--good); font-weight: 600; }
  input, select {
    background: #0f1115; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; min-width: 0;
  }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > input { flex: 1; }

  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; }
  #status { margin-left: auto; color: var(--muted); }
  #roomBadge { font-family: ui-monospace, Consolas, monospace; background: #0f1115; padding: 4px 8px; border-radius: 6px; }

  #lobby { max-width: 460px; margin: 40px auto; padding: 0 16px; display: grid; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
  .card h2 { font-size: 15px; margin: 0; }

  #app { display: grid; grid-template-columns: 1fr 340px; height: calc(100vh - 49px); }
  #gameWrap { position: relative; background: #000; min-height: 300px; }
  #game { width: 100%; height: 100%; border: 0; display: block; }
  #countdown {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 140px; font-weight: 800; color: var(--accent); background: rgba(0,0,0,.55);
    pointer-events: none;
  }
  aside { background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 12px; display: grid; gap: 12px; align-content: start; }
  aside section { background: var(--panel2); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
  aside h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }

  #timer { font: 700 28px ui-monospace, Consolas, monospace; text-align: center; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 4px 6px; text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; font-family: ui-monospace, Consolas, monospace; }
  tr.me td { color: var(--accent); }

  #streams { display: grid; gap: 8px; }
  .stream { position: relative; background: #000; border-radius: 8px; overflow: hidden; }
  .stream video { width: 100%; display: block; cursor: zoom-in; }
  .stream span { position: absolute; left: 6px; top: 4px; font-size: 12px; background: rgba(0,0,0,.6); padding: 1px 6px; border-radius: 4px; }

  #chatLog { max-height: 180px; overflow-y: auto; display: grid; gap: 2px; font-size: 13px; }
  #chatLog b { color: var(--accent); }
  #chatLog .sys { color: var(--muted); font-style: italic; }

  @media (max-width: 820px) {
    #app { grid-template-columns: 1fr; height: auto; }
    #gameWrap { height: 70vh; }
    aside { border-left: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>🚗 Car Park Multijugador</h1>
  <span id="roomBadge" class="hidden"></span>
  <button id="copyLink" class="hidden">Copiar enlace de invitación</button>
  <span id="status">Sin conectar</span>
</header>

<!-- Pantalla inicial -->
<div id="lobby">
  <div class="card">
    <h2>Tu nombre</h2>
    <input id="name" maxlength="16" placeholder="Ej: Jesús">
  </div>
  <div class="card">
    <h2>Crear una sala</h2>
    <p class="muted" style="margin:0">Eres el anfitrión: eliges el nivel y das la salida.</p>
    <button id="create" class="primary">Crear sala</button>
  </div>
  <div class="card">
    <h2>Unirse a una sala</h2>
    <div class="row">
      <input id="joinCode" maxlength="5" placeholder="Código (5 letras)" style="text-transform:uppercase">
      <button id="join" class="primary">Unirse</button>
    </div>
  </div>
  <details class="card">
    <summary>Opciones avanzadas</summary>
    <label class="muted">Dirección del juego (cámbiala si lo juegas desde tu PC, p. ej. http://localhost:8000/index.html)</label>
    <input id="gameUrl">
  </details>
</div>

<!-- Pantalla de juego -->
<div id="app" class="hidden">
  <div id="gameWrap">
    <iframe id="game" allow="autoplay; fullscreen" allowfullscreen></iframe>
    <div id="countdown" class="hidden"></div>
  </div>
  <aside>
    <section>
      <h3>Carrera</h3>
      <div id="raceInfo" class="muted">Esperando a que el anfitrión dé la salida.</div>
      <div id="timer">0:00.0</div>
      <div id="hostControls" class="row hidden">
        <label>Nivel <input id="level" type="number" min="1" value="1" style="width:70px"></label>
        <button id="start" class="primary">¡Salida!</button>
        <button id="resetScores">Reiniciar puntos</button>
      </div>
      <div class="row">
        <button id="finish" class="good" disabled>¡Terminé el nivel!</button>
        <button id="giveUp" disabled>Me rindo</button>
      </div>
    </section>

    <section>
      <h3>Jugadores</h3>
      <table>
        <thead><tr><th>Nombre</th><th class="num">Tiempo</th><th class="num">Puntos</th></tr></thead>
        <tbody id="players"></tbody>
      </table>
    </section>

    <section>
      <h3>Ver a los demás</h3>
      <div class="row">
        <button id="share">Compartir mi pantalla</button>
        <button id="openGame">Abrir juego en otra pestaña</button>
      </div>
      <div id="streams"></div>
    </section>

    <section>
      <h3>Chat</h3>
      <div id="chatLog"></div>
      <form id="chatForm" class="row">
        <input id="chatInput" maxlength="200" placeholder="Escribe un mensaje…" autocomplete="off">
        <button>Enviar</button>
      </form>
    </section>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(() => {
  const DEFAULT_GAME_URL = 'https://inlogic.cdn.msnfun.com/9n96gnlxsktg/v6/index.html';
  const ID_PREFIX = 'carpark-mp-';
  const POINTS = [5, 3, 2, 1]; // puntos por posición de llegada; el resto recibe 1

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);

  // Permite usar un servidor PeerJS propio: ?peerhost=...&peerport=...&peerpath=...&peersecure=0
  const peerOptions = { debug: 1 };
  if (params.get('peerhost')) {
    peerOptions.host = params.get('peerhost');
    peerOptions.port = Number(params.get('peerport') || 443);
    peerOptions.path = params.get('peerpath') || '/';
    peerOptions.secure = params.get('peersecure') !== '0';
  }

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  $('name').value = store.get('cpmp-name') || '';
  $('gameUrl').value = store.get('cpmp-game') || DEFAULT_GAME_URL;
  if (params.get('sala')) $('joinCode').value = params.get('sala').toUpperCase();

  // ---------- Estado ----------
  let peer = null;
  let isHost = false;
  let myId = null;
  let hostConn = null;               // conexión al anfitrión (si soy invitado)
  const guestConns = new Map();      // id -> DataConnection (si soy anfitrión)
  const lastSeen = new Map();        // id -> hora del último mensaje (si soy anfitrión)
  let players = [];                  // [{id, name, score, time, status}]
  let race = { running: false, level: 1, startedAt: 0, finishOrder: 0 };
  let myFinished = false;
  let timerHandle = null;

  let shareStream = null;
  const outCalls = new Map();        // id -> MediaConnection que yo envío
  const inStreams = new Map();       // id -> elemento .stream

  // ---------- Utilidades ----------
  const setStatus = (t) => { $('status').textContent = t; };
  const fmt = (ms) => {
    if (ms == null) return '—';
    const s = ms / 1000;
    return `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
  };
  const myName = () => ($('name').value.trim() || 'Jugador').slice(0, 16);
  const randomCode = () => {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    return Array.from({ length: 5 }, () => abc[Math.floor(Math.random() * abc.length)]).join('');
  };

  function logChat(text, from) {
    const div = document.createElement('div');
    if (from) {
      const b = document.createElement('b');
      b.textContent = from + ': ';
      div.append(b, document.createTextNode(text));
    } else {
      div.className = 'sys';
      div.textContent = text;
    }
    $('chatLog').append(div);
    $('chatLog').scrollTop = $('chatLog').scrollHeight;
  }

  function renderPlayers() {
    const tbody = $('players');
    tbody.textContent = '';
    const sorted = [...players].sort((a, b) => b.score - a.score);
    for (const p of sorted) {
      const tr = document.createElement('tr');
      if (p.id === myId) tr.className = 'me';
      const status = p.status === 'done' ? fmt(p.time)
        : p.status === 'gave-up' ? 'se rindió'
        : p.status === 'playing' ? 'jugando…' : '—';
      for (const [txt, cls] of [[p.name, ''], [status, 'num'], [p.score, 'num']]) {
        const td = document.createElement('td');
        td.textContent = txt;
        if (cls) td.className = cls;
        tr.append(td);
      }
      tbody.append(tr);
    }
    // si comparto pantalla, asegurar que la envío a quien acaba de entrar
    if (shareStream) for (const p of players) if (p.id !== myId) callWithStream(p.id);
    // quitar vídeos de jugadores que se fueron
    for (const id of [...inStreams.keys()]) if (!players.some((p) => p.id === id)) removeStream(id);
  }

  // ---------- Red: envío ----------
  function broadcast(msg) {           // solo anfitrión
    for (const c of guestConns.values()) if (c.open) c.send(msg);
  }
  function send(msg) {                // desde cualquiera
    if (isHost) handleHostMessage(myId, msg);
    else if (hostConn && hostConn.open) hostConn.send(msg);
  }

  // ---------- Lógica del anfitrión ----------
  function hostSyncRoster() {
    broadcast({ t: 'roster', players });
    applyRoster(players);
  }

  function handleHostMessage(fromId, msg) {
    if (fromId !== myId) lastSeen.set(fromId, Date.now());
    const p = players.find((x) => x.id === fromId);
    switch (msg.t) {
      case 'hello':
        if (!p) players.push({ id: fromId, name: String(msg.name).slice(0, 16), score: 0, time: null, status: 'idle' });
        hostSyncRoster();
        hostRelay({ t: 'chat-sys', text: `${String(msg.name).slice(0, 16)} se unió a la sala.` });
        if (race.running) {
          const c = guestConns.get(fromId);
          if (c) c.send({ t: 'late', level: race.level });
        }
        break;
      case 'finish':
        if (!p || !race.running || p.status !== 'playing') return;
        p.status = 'done';
        p.time = Math.max(0, Number(msg.ms) || 0);
        p.score += POINTS[race.finishOrder] ?? 1;
        race.finishOrder++;
        hostRelay({ t: 'chat-sys', text: `🏁 ${p.name} terminó en ${fmt(p.time)} (puesto ${race.finishOrder}).` });
        hostCheckRaceOver();
        hostSyncRoster();
        break;
      case 'giveup':
        if (!p || !race.running || p.status !== 'playing') return;
        p.status = 'gave-up';
        hostRelay({ t: 'chat-sys', text: `${p.name} se rindió.` });
        hostCheckRaceOver();
        hostSyncRoster();
        break;
      case 'chat':
        if (!p) return;
        hostRelay({ t: 'chat', name: p.name, text: String(msg.text).slice(0, 200) });
        break;
      case 'unshare':
        hostRelay({ t: 'unshare', id: fromId });
        break;
    }
  }

  function hostRelay(msg) {
    broadcast(msg);
    handleClientMessage(msg);
  }

  function hostCheckRaceOver() {
    if (players.every((p) => p.status !== 'playing')) {
      race.running = false;
      hostRelay({ t: 'end' });
    }
  }

  function hostStartRace() {
    const level = Math.max(1, Number($('level').value) || 1);
    race = { running: true, level, startedAt: 0, finishOrder: 0 };
    for (const p of players) { p.status = 'playing'; p.time = null; }
    hostSyncRoster();
    hostRelay({ t: 'start', level, countdown: 3 });
  }

  // ---------- Lógica de todos (clientes, incluido el anfitrión) ----------
  function applyRoster(list) {
    players = list;
    renderPlayers();
  }

  function handleClientMessage(msg) {
    switch (msg.t) {
      case 'roster': applyRoster(msg.players); break;
      case 'chat': logChat(msg.text, msg.name); break;
      case 'chat-sys': logChat(msg.text); break;
      case 'start': startCountdown(msg.level, msg.countdown); break;
      case 'late':
        $('raceInfo').textContent = `Hay una carrera en curso (nivel ${msg.level}). Podrás jugar la siguiente.`;
        break;
      case 'end':
        stopTimer();
        setRaceButtons(false);
        $('raceInfo').textContent = 'Carrera terminada. ' + (isHost ? 'Elige otro nivel y da la salida.' : 'Esperando al anfitrión…');
        break;
      case 'reset':
        $('raceInfo').textContent = 'Puntos reiniciados.';
        break;
      case 'unshare': removeStream(msg.id); break;
    }
  }

  function setRaceButtons(on) {
    $('finish').disabled = !on;
    $('giveUp').disabled = !on;
    $('start').disabled = on;
  }

  function startCountdown(level, secs) {
    myFinished = false;
    stopTimer();
    $('timer').textContent = fmt(0);
    $('raceInfo').textContent = `Nivel ${level}: ábrelo en el juego y aparca lo más rápido posible.`;
    const cd = $('countdown');
    cd.classList.remove('hidden');
    let n = secs;
    cd.textContent = n;
    const tick = setInterval(() => {
      n--;
      if (n > 0) { cd.textContent = n; return; }
      clearInterval(tick);
      cd.textContent = '¡YA!';
      setTimeout(() => cd.classList.add('hidden'), 700);
      race.startedAt = performance.now();
      setRaceButtons(true);
      timerHandle = setInterval(() => {
        $('timer').textContent = fmt(performance.now() - race.startedAt);
      }, 100);
    }, 1000);
  }

  function stopTimer() {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = null;
  }

  $('finish').onclick = () => {
    if (myFinished) return;
    myFinished = true;
    const ms = performance.now() - race.startedAt;
    stopTimer();
    $('timer').textContent = fmt(ms);
    $('finish').disabled = true;
    $('giveUp').disabled = true;
    send({ t: 'finish', ms });
  };
  $('giveUp').onclick = () => {
    if (myFinished) return;
    myFinished = true;
    stopTimer();
    $('finish').disabled = true;
    $('giveUp').disabled = true;
    send({ t: 'giveup' });
  };
  $('start').onclick = () => { if (isHost && players.length) hostStartRace(); };
  $('resetScores').onclick = () => {
    if (!isHost) return;
    for (const p of players) { p.score = 0; p.time = null; if (p.status !== 'playing') p.status = 'idle'; }
    hostSyncRoster();
    hostRelay({ t: 'reset' });
  };
  $('chatForm').onsubmit = (e) => {
    e.preventDefault();
    const text = $('chatInput').value.trim();
    if (!text) return;
    send({ t: 'chat', text });
    $('chatInput').value = '';
  };

  // ---------- Pantalla compartida (WebRTC, sin instalar nada) ----------
  function callWithStream(id) {
    if (!shareStream || outCalls.has(id) || !peer) return;
    const call = peer.call(id, shareStream, { metadata: { name: myName() } });
    if (!call) return;
    outCalls.set(id, call);
    call.on('close', () => outCalls.delete(id));
    call.on('error', () => outCalls.delete(id));
  }

  function addStream(id, name, stream) {
    removeStream(id);
    const box = document.createElement('div');
    box.className = 'stream';
    const v = document.createElement('video');
    v.autoplay = true; v.playsInline = true; v.muted = true;
    v.srcObject = stream;
    v.title = 'Clic para pantalla completa';
    v.onclick = () => v.requestFullscreen && v.requestFullscreen();
    const label = document.createElement('span');
    label.textContent = name;
    box.append(v, label);
    $('streams').append(box);
    inStreams.set(id, box);
  }

  function removeStream(id) {
    const box = inStreams.get(id);
    if (box) { box.remove(); inStreams.delete(id); }
  }

  async function toggleShare() {
    if (shareStream) { stopShare(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      alert('Tu navegador no permite compartir pantalla. Usa Chrome, Edge o Firefox actualizados.');
      return;
    }
    try {
      shareStream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 30 }, audio: false, preferCurrentTab: true, selfBrowserSurface: 'include',
      });
    } catch {
      return; // el usuario canceló
    }
    shareStream.getVideoTracks()[0].addEventListener('ended', stopShare);
    $('share').textContent = 'Dejar de compartir';
    for (const p of players) if (p.id !== myId) callWithStream(p.id);
  }

  function stopShare() {
    if (!shareStream) return;
    shareStream.getTracks().forEach((t) => t.stop());
    shareStream = null;
    for (const c of outCalls.values()) c.close();
    outCalls.clear();
    $('share').textContent = 'Compartir mi pantalla';
    send({ t: 'unshare' });
  }

  $('share').onclick = toggleShare;
  $('openGame').onclick = () => window.open($('gameUrl').value || DEFAULT_GAME_URL, '_blank');

  // ---------- Conexión ----------
  function enterApp(code) {
    store.set('cpmp-name', myName());
    store.set('cpmp-game', $('gameUrl').value.trim() || DEFAULT_GAME_URL);
    $('lobby').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('game').src = $('gameUrl').value.trim() || DEFAULT_GAME_URL;
    $('roomBadge').textContent = 'Sala ' + code;
    $('roomBadge').classList.remove('hidden');
    $('copyLink').classList.remove('hidden');
    $('hostControls').classList.toggle('hidden', !isHost);
    $('copyLink').onclick = async () => {
      const url = new URL(location.href);
      url.search = '';
      for (const k of ['peerhost', 'peerport', 'peerpath', 'peersecure']) if (params.get(k)) url.searchParams.set(k, params.get(k));
      url.searchParams.set('sala', code);
      try { await navigator.clipboard.writeText(url.href); $('copyLink').textContent = '¡Copiado!'; }
      catch { prompt('Copia este enlace:', url.href); }
      setTimeout(() => { $('copyLink').textContent = 'Copiar enlace de invitación'; }, 1500);
    };
  }

  function setupMediaAnswer() {
    peer.on('call', (call) => {
      call.answer(); // solo recibimos
      call.on('stream', (stream) => {
        const name = (call.metadata && call.metadata.name) || 'Jugador';
        addStream(call.peer, name, stream);
      });
      call.on('close', () => removeStream(call.peer));
    });
  }

  function lockLobby(on) {
    $('create').disabled = on;
    $('join').disabled = on;
  }

  function createRoom(attempt = 0) {
    lockLobby(true);
    const code = randomCode();
    setStatus('Creando sala…');
    peer = new Peer(ID_PREFIX + code, peerOptions);
    peer.on('open', (id) => {
      myId = id;
      isHost = true;
      players = [{ id, name: myName(), score: 0, time: null, status: 'idle' }];
      enterApp(code);
      renderPlayers();
      setStatus('Anfitrión · comparte el código con tus amigos');
      logChat(`Sala creada. Código: ${code}`);
    });
    peer.on('connection', (conn) => {
      conn.on('open', () => guestConns.set(conn.peer, conn));
      conn.on('data', (msg) => handleHostMessage(conn.peer, msg));
      conn.on('close', () => hostDropGuest(conn.peer));
    });
    // Si alguien cierra la pestaña de golpe, WebRTC puede tardar mucho en avisar:
    // los invitados mandan un 'ping' cada 3 s y quitamos a quien lleve 10 s callado.
    setInterval(() => {
      for (const [id, t] of lastSeen) if (Date.now() - t > 10000) hostDropGuest(id);
    }, 3000);
    setupMediaAnswer();
    peer.on('error', (err) => {
      if (err.type === 'unavailable-id' && attempt < 5 && !myId) {
        peer.destroy();
        createRoom(attempt + 1);
        return;
      }
      networkError(err);
    });
  }

  function hostDropGuest(id) {
    const conn = guestConns.get(id);
    guestConns.delete(id);
    lastSeen.delete(id);
    if (conn) conn.close();
    const p = players.find((x) => x.id === id);
    if (!p) return;
    players = players.filter((x) => x.id !== id);
    hostRelay({ t: 'chat-sys', text: `${p.name} salió de la sala.` });
    if (race.running) hostCheckRaceOver();
    hostSyncRoster();
  }

  function joinRoom() {
    const code = $('joinCode').value.trim().toUpperCase();
    if (!/^[A-Z]{5}$/.test(code)) { alert('El código tiene 5 letras.'); return; }
    lockLobby(true);
    setStatus('Conectando…');
    peer = new Peer(undefined, peerOptions);
    peer.on('open', (id) => {
      myId = id;
      hostConn = peer.connect(ID_PREFIX + code, { reliable: true });
      hostConn.on('open', () => {
        enterApp(code);
        setStatus('Conectado');
        hostConn.send({ t: 'hello', name: myName() });
        setInterval(() => { if (hostConn.open) hostConn.send({ t: 'ping' }); }, 3000);
      });
      hostConn.on('data', handleClientMessage);
      hostConn.on('close', () => {
        setStatus('El anfitrión cerró la sala');
        logChat('Se perdió la conexión con el anfitrión.');
        stopTimer();
        setRaceButtons(false);
      });
    });
    setupMediaAnswer();
    peer.on('error', (err) => {
      if (err.type === 'peer-unavailable') {
        alert('No existe ninguna sala con ese código (o el anfitrión la cerró).');
        peer.destroy();
        peer = null;
        lockLobby(false);
        setStatus('Sin conectar');
        return;
      }
      networkError(err);
    });
  }

  function networkError(err) {
    console.error(err);
    const fatal = ['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible', 'ssl-unavailable'];
    if (fatal.includes(err.type)) {
      setStatus('Error de red');
      if (!myId) {
        alert('No se pudo conectar al servicio de salas (PeerJS). Puede que la red de tu escuela/trabajo lo bloquee. Prueba desde otra red o con datos móviles.');
        lockLobby(false);
      }
    }
  }

  $('create').onclick = () => {
    if (typeof Peer === 'undefined') { alert('No se pudo cargar PeerJS. Revisa tu conexión a internet.'); return; }
    createRoom();
  };
  $('join').onclick = () => {
    if (typeof Peer === 'undefined') { alert('No se pudo cargar PeerJS. Revisa tu conexión a internet.'); return; }
    joinRoom();
  };
  $('joinCode').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('join').click(); });

  window.addEventListener('beforeunload', () => { if (peer) peer.destroy(); });
})();
</script>
</body>
</html>
